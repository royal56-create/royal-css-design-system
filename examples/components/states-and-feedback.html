<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Component states</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.state-btn{padding:.7rem 1rem;border:0;border-radius:.5rem;background:var(--color-primary);color:#fff;font-weight:700}.state-btn:hover{background:var(--color-primary-hover)}.state-btn:active{transform:scale(.98)}.state-btn:disabled{opacity:.5;cursor:not-allowed}.state-field{padding:.7rem;border:1px solid var(--color-border);border-radius:.5rem}.state-field:focus{outline:3px solid var(--color-focus);outline-offset:2px}.state-field:invalid:not(:placeholder-shown){border-color:#b42318}</style></head><body><main class="container section"><a href="../../index.html">← Home</a><h1>UI states and feedback</h1><p>Design default, hover, active, focus, disabled and invalid states. Do not communicate errors by color alone in a real product.</p><div class="cluster"><button class="state-btn" type="button">Hover / press</button><button class="state-btn" type="button" disabled>Disabled</button><label>Email <input class="state-field" type="email" placeholder="name@example.com"></label></div></main></body></html>
