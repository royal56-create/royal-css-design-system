<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Styled forms</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.demo-form{max-width:34rem;display:grid;gap:1rem}.demo-form input,.demo-form select,.demo-form textarea{width:100%;padding:.7rem;border:1px solid var(--color-border);border-radius:.5rem;background:var(--color-surface);color:var(--color-text)}.demo-form label{font-weight:700}</style></head><body><main class="container section"><a href="../../index.html">← Home</a><h1>Forms and input styling</h1><p>Use explicit labels, helpful input types, clear error states and visible focus styles.</p><form class="card demo-form"><label for="full-name">Full name</label><input id="full-name" name="name" autocomplete="name" required><label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" required><label for="topic">Topic</label><select id="topic" name="topic"><option>CSS basics</option><option>Responsive design</option></select><label for="message">Message</label><textarea id="message" name="message" rows="3"></textarea><button class="button button-primary" type="submit">Demo submit</button></form></main></body></html>
