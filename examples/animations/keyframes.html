<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS keyframes</title><link rel="stylesheet" href="../../assets/css/main.css"><style>.pulse-dot{width:2rem;height:2rem;border-radius:50%;background:var(--color-accent);animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.55}}@media(prefers-reduced-motion:reduce){.pulse-dot{animation:none}}</style></head><body><main class="container section"><a href="../../index.html">← Home</a><h1>Keyframe animations</h1><p>Use keyframes for multi-step motion and disable nonessential animation for reduced-motion users.</p><div class="pulse-dot" role="img" aria-label="Animated pulse indicator"></div><pre><code>@keyframes pulse { 50% { transform: scale(1.35); opacity: .55; } }</code></pre></main></body></html>
